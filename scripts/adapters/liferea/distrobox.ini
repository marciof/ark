[liferea-v1]

# Last checked: https://github.com/lwindolf/liferea/tree/v1.16.7

# TODO use distrobox ephemeral?
#   $ env -i distrobox ephemeral --clone liferea --home "`mktemp -d`" --unshare-all --init -- liferea
# TODO document
#   $ distrobox assemble create
#   $ docker logs -f liferea
#   # TODO make entering the container automatically launch the app, by default?
#   $ env -i distrobox enter liferea -- liferea

include=liferea-base
start_now=true

# TODO remove hardcoded home path?
home=/tmp/distrobox-home-liferea-v1

additional_packages=liferea

# Setup Python environment for installing the plugin.
# TODO cache Python packages? see also `.cache/pip/`
additional_packages=python3-venv
init_hooks="asuser sh -c "python3 -m venv ~/venv && . ~/venv/bin/activate && pip install pip\>=26""

# TODO remove hardcoded home path?
# TODO simplify
volume=.:/tmp/distrobox-home-liferea-v1/plugin:ro
init_hooks="asuser sh -c ". ~/venv/bin/activate && pip install --requirements-from-script ~/plugin/path_to.py && ~/plugin/path_to.py plugins | xargs mkdir -v -p && ~/plugin/path_to.py plugins | xargs ln -s -v -f ~/plugin/ext_cmd/""

[liferea-v2]

include=liferea-base
start_now=true

# TODO remove hardcoded home path?
home=/tmp/distrobox-home-liferea-v2

# See: https://github.com/lwindolf/liferea/blob/main/.github/workflows/cb.yml
additional_packages="libxml2-dev libxslt1-dev libsqlite3-dev libwebkitgtk-6.0-dev libjson-glib-dev libgirepository-2.0-dev libpeas-2-dev gsettings-desktop-schemas-dev python3 libtool intltool valgrind libfribidi-dev gla11y appstream desktop-file-utils meson ninja-build gobject-introspection libadwaita-1-dev libdbus-1-dev"

# TODO missing from dependencies?
#    ** (net.sourceforge.liferea:16755): WARNING **: 00:02:14.520: Error initializing Python Plugin Loader: PyGObject initialization failed
#    ImportError: could not import gobject (error was: ModuleNotFoundError("No module named 'gi'"))
#    ** (net.sourceforge.liferea:16755): WARNING **: 00:02:14.549: Please check the installation of all the Python related packages required by libpeas and try again
#    (net.sourceforge.liferea:16755): libpeas-WARNING **: 00:02:14.549: Loader 'python' is not a valid PeasPluginLoader instance
additional_packages="python3-gi"

# Release v2.0 has a breaking bug, so use the commit that fixes it.
# https://github.com/lwindolf/liferea/discussions/1585
#   init_hooks="curl -L https://github.com/lwindolf/liferea/releases/download/v2.0/liferea-2.0.tar.xz | asuser tar -x -v -J -f - -C ~/"
#   init_hooks="asuser mv -v ~/liferea-2.0/ ~/liferea/"
init_hooks="asuser curl -L -o ~/liferea.zip https://github.com/lwindolf/liferea/archive/145f52b30aa6568a6c7b1b0b38705f4628ce8a80.zip"
init_hooks="asuser unzip -d ~/ ~/liferea.zip"
init_hooks="asuser mv -v ~/liferea-*/ ~/liferea/"

init_hooks="asuser meson setup ~/build/ ~/liferea/"
init_hooks="asuser meson compile -C ~/build/"
init_hooks="asuser meson test -C ~/build/"
init_hooks="meson install -C ~/build/"
