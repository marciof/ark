[base]
# TODO create new base package w/ pre-installed dependencies? to speed up
# TODO skip `apt-get update`?
# TODO how to handle initial password requirement?
image=ubuntu:26.04

# Cache packages to speed up container creation on future runs.
volume=~/.cache/distrobox-apt-ubuntu-26-04:/var/cache/apt/archives

# See: https://hub.docker.com/r/docker/dockerfile#example-cache-apt-packages
pre_init_hooks="rm -v /etc/apt/apt.conf.d/docker-clean"

# Prints a single literal double quote.
# TODO file GitHub issue on Distrobox?
# - double quote behavior != `init_hook`
# - find out exact file format for manifest files
# - `init-hooks` flag overrides previous flags vs appending like manifest file
pre_init_hooks="dq() { printf Ig== | base64 -d; }"

# See: https://salsa.debian.org/apt-team/apt/-/blob/1.2/debian/NEWS
pre_init_hooks="{ printf \"APT::Keep-Downloaded-Packages \"; dq; printf true; dq; echo \";\"; } | tee /etc/apt/apt.conf.d/01_keep-pkgs"

# Disable slow locale generation.
# TODO could this break anything?
pre_init_hooks="divert() { dpkg-divert --local --divert \"\$1.real\" --rename --add \"\$1\" && ln -s -v -f /bin/true \"\$1\"; }"
pre_init_hooks="divert /usr/sbin/locale-gen"
pre_init_hooks="divert /usr/sbin/update-locale"

# TODO remove non-root user hack
#   https://github.com/89luca89/distrobox/issues/2170
init_hooks="asuser() { runuser -u "$(stat -c %U ~)" -- "$@"; }"

[liferea]
# Last checked: https://github.com/lwindolf/liferea/tree/v1.16.7

# TODO use distrobox ephemeral?
#   $ env -i distrobox ephemeral --clone liferea --home "`mktemp -d`" --unshare-all --init -- liferea
# TODO document
#   $ distrobox assemble create
#   $ docker logs -f liferea
#   $ env -i distrobox enter liferea -- liferea

include=base
start_now=true
unshare_all=true
init=true

# Avoid video rendering errors.
# TODO set `LIBGL_ALWAYS_SOFTWARE=1` to force software rendering?
nvidia=true

# TODO remove hardcoded home path?
home=/tmp/distrobox-home-liferea

additional_packages=liferea

# Required by the `download-manager` plugin:
#   https://github.com/lwindolf/liferea/issues/1584
additional_packages=python3-requests

# Required by the `gnome-keyring` plugin.
# TODO file Liferea bug?
#    (net.sourceforge.liferea:12891): libsecret-CRITICAL **: 17:36:12.213: secret_service_load_collections_sync: assertion 'paths != NULL' failed
#    Traceback (most recent call last):
#        File "/usr/lib/x86_64-linux-gnu/liferea/plugins/gnome-keyring.py", line 49, in do_query
#        coll = self.get_collection()
#        File "/usr/lib/x86_64-linux-gnu/liferea/plugins/gnome-keyring.py", line 39, in get_collection
#        colls = service.get_collections()
#        ^^^^^^^^^^^^^^^^^^^^^^^
#    AttributeError: 'NoneType' object has no attribute 'get_collections'
# - else -
#    ** (net.sourceforge.liferea:16778): WARNING **: 17:42:56.176: Error importing plugin 'gnome-keyring':
#    Traceback (most recent call last):
#        File "/usr/lib/python3.14/importlib/__init__.py", line 88, in import_module
#        return _bootstrap._gcd_import(name[level:], package, level)
#        ~~~~~~~~~~~~~~~~~~~~~~^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^
#        File "<frozen importlib._bootstrap>", line 1406, in _gcd_import
#        File "<frozen importlib._bootstrap>", line 1371, in _find_and_load
#        File "<frozen importlib._bootstrap>", line 1342, in _find_and_load_unlocked
#        File "<frozen importlib._bootstrap>", line 938, in _load_unlocked
#        File "<frozen importlib._bootstrap_external>", line 759, in exec_module
#        File "<frozen importlib._bootstrap>", line 491, in _call_with_frames_removed
#        File "/usr/lib/x86_64-linux-gnu/liferea/plugins/gnome-keyring.py", line 22, in <module>
#        gi.require_version('Secret', '1')
#        ~~~~~~~~~~~~~~~~~~^^^^^^^^^^^^^^^
#        File "/usr/lib/python3/dist-packages/gi/__init__.py", line 150, in require_version
#        raise ValueError(f"Namespace {namespace} not available")
#    ValueError: Namespace Secret not available
additional_packages="gir1.2-secret-1 gnome-keyring"

# Setup Python environment for installing the plugin.
# TODO cache Python packages? see also `.cache/pip/`
additional_packages=python3-venv
init_hooks="asuser sh -c "python3 -m venv ~/venv && . ~/venv/bin/activate && pip install pip\>=26""

# TODO remove hardcoded home path?
# TODO simplify
volume=.:/tmp/distrobox-home-liferea/plugin:ro
init_hooks="asuser sh -c ". ~/venv/bin/activate && pip install --requirements-from-script ~/plugin/path_to.py && ~/plugin/path_to.py plugins | xargs mkdir -v -p && ~/plugin/path_to.py plugins | xargs ln -v -s ~/plugin/ext_cmd/""
