[base]

# Features:
#
# - Enables `apt` caching of downloaded packages, to speed up container runs.
#
# - Disables locale generation, to speed up container runs.
#
# - Enables NVidia support and forces software-based video rendering, to avoid
#   errors from polluting logs.
#
# - Provides a `asuser` shell function, to run commands as a non-root user in
#   `init_hooks`.
#
# - Provides a `dq` shell function, to print literal double-quotes for use in
#   `pre_init_hooks`.
#
# - Provides a `divert` shell function, to selectively disable a specified
#   binary using `dpkg-divert` (as a symlink to `true`) for use in
#   `pre_init_hooks`.
#
# - Provides a `setenv` shell function, to add a variable in the
#   `/etc/environment` file in `init_hooks`.

# TODO create new base package w/ pre-installed dependencies? to speed up
# TODO skip `apt-get update`?
# TODO how to handle initial password requirement?
image=ubuntu:26.04

# Prints a single literal double quote.
# TODO file GitHub issue on Distrobox?
# - double quote behavior != `init_hook`
# - find out exact file format for manifest files
# - `init-hooks` flag overrides previous flags vs appending like manifest file
pre_init_hooks="dq() { printf Ig== | base64 -d; }"

# Cache packages.
# See: https://hub.docker.com/r/docker/dockerfile#example-cache-apt-packages
# See: https://salsa.debian.org/apt-team/apt/-/blob/1.2/debian/NEWS
volume=~/.cache/distrobox-apt-ubuntu-26-04:/var/cache/apt/archives
pre_init_hooks="rm -v -f /etc/apt/apt.conf.d/docker-clean"
pre_init_hooks="{ printf \"APT::Keep-Downloaded-Packages \"; dq; printf true; dq; echo \";\"; } | tee /etc/apt/apt.conf.d/01_keep-pkgs"

# Divert a binary to `true`, effectively disabling it.
# TODO is this idempotent?
pre_init_hooks="divert() { dpkg-divert --local --divert \"\$1.real\" --rename --add \"\$1\" && ln -s -v -f /bin/true \"\$1\"; }"

# Disable locale generation.
# TODO could this break anything?
pre_init_hooks="divert /usr/sbin/locale-gen"
pre_init_hooks="divert /usr/sbin/update-locale"

init_hooks="setenv() { grep -q -F "$1" /etc/environment || echo "$1" | tee -a /etc/environment; }"

# Avoid video rendering errors.
nvidia=true
# TODO will `LIBGL_ALWAYS_SOFTWARE=true` make Liferea too slow?
init_hooks="setenv LIBGL_ALWAYS_SOFTWARE=true"
# TODO should this be set only where needed? for Liferea v2?
init_hooks="setenv GSK_RENDERER=gl"

# Runs a command as non-root.
# TODO remove non-root user hack
# - https://github.com/89luca89/distrobox/issues/2170
# - replace `stat` with a Posix compliant impl?
init_hooks="asuser() { runuser -u "$(stat -c %U ~)" -- "$@"; }"

[liferea-base]

# Installs required dependencies for the `download-manager` and `gnome-keyring`
# plugins.

include=base
unshare_all=true
init=true

# Required by the `download-manager` plugin:
#   https://github.com/lwindolf/liferea/issues/1584
additional_packages=python3-requests

